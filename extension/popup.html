<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sniff Player</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Sniff Player</h1>
  <ul id="list"></ul>
  <p id="empty" data-i18n="emptyList" hidden></p>
  <form id="manual">
    <input id="manual-url" type="url" data-i18n-placeholder="pastePlaceholder" data-i18n-aria-label="pasteLabel" required>
    <button type="submit" data-i18n="play"></button>
  </form>
  <label id="setting">
    <input id="play-in-page" type="checkbox">
    <span><span data-i18n="playInPage"></span><small data-i18n="playInPageHint"></small></span>
  </label>
  <label class="sub-setting">
    <input id="fill-on-play" type="checkbox">
    <span data-i18n="fillOnPlay"></span>
  </label>
  <label class="sub-setting">
    <input id="unfill-on-end" type="checkbox">
    <span data-i18n="unfillOnEnd"></span>
  </label>
  <script type="module" src="popup.js"></script>
</body>
</html>
